name: Build Kup Auto Bez Miny SIGNED APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: |
          rm -rf source
          mkdir -p source
          unzip -q -o KupAutoBezMiny_Android_Source_v0.10_PRODUCT_POLISH.zip -d source

      - name: Fix PrintManager import
        run: |
          sed -i 's/import android.app.PrintManager;/import android.print.PrintManager;/' source/KupAutoBezMiny_Android/app/src/main/java/pl/kupautobezminy/app/MainActivity.java

      - name: Restore permanent signing key
        env:
          KABM_KEYSTORE_BASE64: ${{ secrets.KABM_KEYSTORE_BASE64 }}
        run: |
          echo "$KABM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kabm-release.jks"

      - name: Build signed release APK
        working-directory: source/KupAutoBezMiny_Android
        env:
          KABM_KEYSTORE_PATH: ${{ runner.temp }}/kabm-release.jks
          KABM_KEYSTORE_PASSWORD: ${{ secrets.KABM_KEYSTORE_PASSWORD }}
          KABM_KEY_ALIAS: kabm-release
          KABM_KEY_PASSWORD: ${{ secrets.KABM_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs source/KupAutoBezMiny_Android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KupAutoBezMiny-SIGNED-release-apk
          path: source/KupAutoBezMiny_Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
