name: Build Kup Auto Bez Miny APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: |
          rm -rf source
          mkdir -p source
          unzip -q -o KupAutoBezMiny_Android_Source_v0.4_UX_BOOST.zip -d source

      - name: Fix PrintManager import
        run: |
          sed -i 's/import android.app.PrintManager;/import android.print.PrintManager;/' source/KupAutoBezMiny_Android/app/src/main/java/pl/kupautobezminy/app/MainActivity.java

      - name: Build debug APK
        working-directory: source/KupAutoBezMiny_Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KupAutoBezMiny-test-apk
          path: source/KupAutoBezMiny_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
